apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnv-gitops-vms
  namespace: openshift-gitops
spec:
  destination:
    namespace: vm-demo 
    server: https://kubernetes.default.svc
  project: default
  source:
    path: overlays
    repoURL: https://github.com/benjphipps/rhdh-virt-demo.git
    targetRevision: main
  syncPolicy:
    syncOptions:
      - CreateNamespace=true